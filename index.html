<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Forecast</h1>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button onclick="getWeather()">Search</button>
        </div>

        <div id="weather" class="weather-card">

            <h2 id="city">Weather Information</h2>

            <div class="weather-icon" id="icon">🌤️</div>

            <h3 id="temperature">-- °C</h3>

            <p id="description">Search for a city</p>

            <div class="details">

                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div>
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div>
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feels">-- °C</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
